name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stellar_alerts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/stellar_alerts?schema=public"

      - name: Verify generated OpenAPI types are up to date
        run: npm run generate:types:check

      - name: Build Shared Package (@stellar-alerts/shared)
        run: npx tsc -p packages/shared/tsconfig.json

      - name: Typecheck Backend (apps/api)
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck Frontend (apps/web)
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Push Prisma Schema (test database)
        run: npm run db:push
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/stellar_alerts?schema=public"

      - name: Run API Unit Tests
        run: npm run test:api
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/stellar_alerts?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-unit-test-secret-key-min-32-chars!!"
          MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NODE_ENV: "test"

      - name: Run Web Lint
        run: npm run lint --workspace=web

      - name: Run Web Unit Tests
        run: npm run test --workspace=web

      - name: Build Web Application
        run: npm run build --workspace=web
        env:
          NEXTAUTH_SECRET: "ci-build-dummy-secret-key-123456"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"

  openapi-compatibility:
    name: OpenAPI Breaking-Change Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # `git show <base_ref>:openapi.json` needs the merge-base commit of
          # the PR against its base branch, not just the tip.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run OpenAPI checker test suite
        run: npm run test:scripts

      - name: Resolve base spec (main) for comparison
        id: base-spec
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            # pull_request event: diff against the merge base with the target
            # branch, so the PR is only blamed for changes it actually makes
            # (not for spec changes main landed after the branch was cut).
            BASE_SHA="$(git merge-base "origin/${BASE_REF}" HEAD)"
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            # push event: diff against the previous commit on this branch
            BASE_SHA="$BEFORE_SHA"
          else
            BASE_SHA="$(git rev-parse origin/main)"
          fi
          echo "Comparing against base commit $BASE_SHA"
          if git show "$BASE_SHA:openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "base_spec_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "base_spec_exists=false" >> "$GITHUB_OUTPUT"
            echo "No openapi.json on $BASE_SHA — comparison will be skipped"
          fi

      - name: Detect breaking OpenAPI schema changes
        if: steps.base-spec.outputs.base_spec_exists == 'true'
        run: |
          set -o pipefail
          npx tsx scripts/check-openapi-breaking-changes.ts \
            --base-path /tmp/base-openapi.json 2>&1 | tee /tmp/openapi-report.txt

      - name: Add report to the job summary
        if: always()
        run: |
          {
            echo '## 📇 OpenAPI compatibility report'
            echo ''
            if [ -s /tmp/openapi-report.txt ]; then
              echo '```'
              cat /tmp/openapi-report.txt
              echo '```'
            else
              echo '_No OpenAPI comparison ran (no spec on base)._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  chaos:
    name: Chaos Engineering Fault Injection Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/stellar_alerts?schema=public"

      - name: Build Shared Package (@stellar-alerts/shared)
        run: npx tsc -p packages/shared/tsconfig.json

      # docker-compose.yml port-maps toxiproxy and points it at the host via
      # host.docker.internal (an extra_hosts host-gateway entry), since the
      # chaos suite's fixture server binds to localhost on the runner, not
      # inside the toxiproxy container.
      - name: Start Toxiproxy
        run: docker compose up -d toxiproxy

      - name: Wait for Toxiproxy to be ready
        run: |
          for i in $(seq 1 1 30); do
            if curl -sf http://localhost:8474/version > /dev/null; then
              echo "Toxiproxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "Toxiproxy did not become ready in time" >&2
          docker compose logs toxiproxy
          exit 1

      - name: Run Chaos Test Suite
        working-directory: apps/api
        run: npx vitest run src/__tests__/chaos.test.ts
        env:
          TOXIPROXY_URL: http://localhost:8474
          TOXIPROXY_UPSTREAM_HOST: host.docker.internal

      - name: Stop Toxiproxy
        if: always()
        run: docker compose down toxiproxy || true
